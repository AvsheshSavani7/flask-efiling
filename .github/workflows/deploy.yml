name: Deploy Flask to VPS

on:
  push:
    branches:
      - vps/main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Flask app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apps/flask-app
            bash deploy.sh