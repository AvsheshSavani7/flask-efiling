services:
  flask-app:
    build: .
    container_name: flask_app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "10000"
    environment:
      - PORT=10000
    volumes:
      - /opt/apps/flask-logs:/var/data/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask-app.rule=Host(`flask.arbintel.cloud`)"
      - "traefik.http.routers.flask-app.entrypoints=websecure"
      - "traefik.http.routers.flask-app.tls=true"
      - "traefik.http.routers.flask-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.flask-app.loadbalancer.server.port=10000"
